{% extends "base.html" %}


{% block title %}

Owner Login | Style Mantra

{% endblock %}


{% block content %}

<section class="login-page">

    <div class="login-card">

        <div class="login-logo">

            <img
                src="{{ url_for(
                    'static',
                    filename='images/logo.png'
                ) }}"
                alt="Style Mantra"
            >

        </div>


        <p class="section-label">
            OWNER PORTAL
        </p>


        <h1>
            Welcome Back
        </h1>


        <p class="login-subtitle">

            Login to manage your
            properties and listings.

        </p>


        {% if error %}

        <div class="login-error">

            {{ error }}

        </div>

        {% endif %}


        <form method="POST">


            <div class="form-group">

                <label>
                    Email Address
                </label>

                <input
                    type="email"
                    name="email"
                    placeholder="owner@stylemantra.com"
                    required
                >

            </div>


            <div class="form-group">

                <label>
                    Password
                </label>

                <input
                    type="password"
                    name="password"
                    placeholder="Enter password"
                    required
                >

            </div>


            <button
                type="submit"
                class="gold-button login-button"
            >

                Login to Dashboard

            </button>


        </form>


        <a
            href="{{ url_for('home') }}"
            class="back-home"
        >

            ← Back to Website

        </a>


    </div>

</section>

{% endblock %}
